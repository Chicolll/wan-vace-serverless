name: trueslim-image
on:
  push:
    branches: [slim-rebuild]
    paths: ["slim_rebuild/**", ".github/workflows/trueslim.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free runner disk (image needs ~16 GiB uncompressed)
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: slim_rebuild
          push: true
          tags: |
            ghcr.io/chicolll/wan-vace-trueslim:${{ github.sha }}
            ghcr.io/chicolll/wan-vace-trueslim:latest
      - name: size gate (<= 8 GiB compressed)
        run: |
          docker buildx imagetools inspect --raw ghcr.io/chicolll/wan-vace-trueslim:${{ github.sha }} \
          | python3 -c "import json,sys; m=json.load(sys.stdin); L=m.get('layers',[]); s=sum(l['size'] for l in L); print(f'{s/2**30:.2f} GiB compressed across {len(L)} layers'); sys.exit(0 if s <= 8*2**30 else 1)"
