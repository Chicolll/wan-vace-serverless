# Render worker image (true-slim, pipeline contract v1). Built from
# slim_rebuild/ on the render-slim branch — never fsdp/raylight (RunPod's
# integration on the upstream repo watches those). Gates after the build
# (BUILD.md): manifest <= 8 GiB compressed, one canary boot on stagingtest,
# prod repoint is a separate explicit go.
name: render-slim-image
on:
  push:
    branches: [render-slim]
    paths:
      - "slim_rebuild/**"
      - ".github/workflows/render-slim.yml"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free runner disk
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: slim_rebuild
          file: slim_rebuild/Dockerfile
          push: true
          # plain manifest, no OCI attestation index: RunPod's puller gets the
          # simplest artifact and the size gate sees layers directly
          provenance: false
          tags: ghcr.io/chicolll/wan-vace-fsdp:trueslim-${{ github.sha }}
