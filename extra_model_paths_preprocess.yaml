# Preprocess endpoint model map (2026-08-19, our-account deployment).
# Primary: /opt/prep_models — a symlink tree prep_setup.py builds at container
# start, pointing at the host-NVMe model store when staged (fast path) or the
# network-volume fallback when not. The graph's reference names (qwen/ subpaths
# for GGUF+LoRA, flat for the rest) resolve identically either way.
prep:
  base_path: /opt/prep_models/
  is_default: true
  unet: unet/
  gguf: unet/
  diffusion_models: unet/
  loras: loras/
  clip: text_encoders/
  text_encoders: text_encoders/
  vae: vae/
  sam3: sam3/
# Volume fallback tree also exposed directly (anything staged only on the
# volume — extra ckpts, future models — stays loadable without a rebuild).
volume:
  base_path: /runpod-volume/prep-models/ComfyUI/models/
  unet: unet/
  gguf: unet/
  loras: loras/
  clip: text_encoders/
  text_encoders: text_encoders/
  vae: vae/
  sam3: sam3/
